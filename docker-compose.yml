services:
  mysql:
    image: mysql:8.4
    container_name: japanese-learning-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-japanese_learning}
      MYSQL_USER: ${MYSQL_USER:-japanese}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-japanese_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: japanese-learning-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-japanese_learning}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-japanese}
      DB_PASSWORD: ${MYSQL_PASSWORD:-japanese_dev}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-to-a-long-random-value}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: japanese-learning-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
