spring:
  application:
    name: japanese-learning-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/japanese_learning?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

app:
  jwt:
    issuer: japanese-learning-platform
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}